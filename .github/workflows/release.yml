name: Release
on:
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: write
env:
  BIN_NAME: mkpasswd-go
jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - run: sudo apt-get update && sudo apt-get install -y libcrypt-dev
      - name: Check that the release tag is a valid Go module version
        if: github.event_name == 'release'
        run: |
          if ! [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]]; then
            echo "::error::Release tag $GITHUB_REF_NAME is not a valid semver Go module version (vX.Y.Z)"
            exit 1
          fi
      - run: go build ./...
      - run: go vet ./...
  build:
    needs: check-version
    name: Build for ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
          - runner: macos-15
            goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"
      - name: Install libxcrypt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libcrypt-dev
      - name: Install libxcrypt (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libxcrypt
          echo "PKG_CONFIG_PATH=$(brew --prefix libxcrypt)/lib/pkgconfig" >> "$GITHUB_ENV"
      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: go build -ldflags="-s -w -X main.version=$GITHUB_REF_NAME" -o "$BIN_NAME-$GOOS-$GOARCH"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.goos }}-${{ matrix.goarch }}
          path: ${{ env.BIN_NAME }}-*
          retention-days: 1
  build-musl:
    # fully static against musl and a libxcrypt built from source, so the binaries also run on Alpine
    needs: check-version
    name: Build for linux/${{ matrix.goarch }} (musl)
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            goarch: amd64
          - runner: ubuntu-24.04-arm
            goarch: arm64
    steps:
      - uses: actions/checkout@v7
      - name: Build static binary
        env:
          GOARCH: ${{ matrix.goarch }}
        run: |
          docker run --rm -v "$PWD":/src -w /src -e VERSION="$GITHUB_REF_NAME" -e OUT="$BIN_NAME-linux-musl-$GOARCH" golang:1.26-alpine sh -ec '
            apk add --no-cache build-base pkgconf curl xz perl
            cd /tmp
            curl -fsSLO https://github.com/besser82/libxcrypt/releases/download/v4.5.2/libxcrypt-4.5.2.tar.xz
            curl -fsSLO https://github.com/besser82/libxcrypt/releases/download/v4.5.2/libxcrypt-4.5.2.tar.xz.sha256sum
            grep " libxcrypt-4.5.2.tar.xz\$" libxcrypt-4.5.2.tar.xz.sha256sum | sha256sum -c
            tar -xf libxcrypt-4.5.2.tar.xz
            cd libxcrypt-4.5.2
            ./configure --prefix=/opt/xcrypt --disable-shared --enable-static
            make -j"$(nproc)" install
            cd /src
            PKG_CONFIG_PATH=/opt/xcrypt/lib/pkgconfig go build -ldflags="-s -w -linkmode external -extldflags \"-static\" -X main.version=$VERSION" -o "$OUT"'
          if ! file "$BIN_NAME-linux-musl-$GOARCH" | grep -q "statically linked"; then
            echo "::error::$BIN_NAME-linux-musl-$GOARCH is not statically linked"
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: binary-linux-musl-${{ matrix.goarch }}
          path: ${{ env.BIN_NAME }}-*
          retention-days: 1
  release:
    name: Create GitHub Release
    needs: [build, build-musl]
    runs-on: ubuntu-latest
    steps:
      - name: Download all binaries
        uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
